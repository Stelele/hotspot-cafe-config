<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="pragma" content="no-cache" />
    <meta http-equiv="expires" content="-1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Njeremoto Internet hotspot - Log in</title>
    <link rel="stylesheet" href="css/style.css">
<style>
.tab-bar {
    display: flex;
    border-bottom: 1px solid rgba(255,255,255,0.15);
    margin-bottom: 16px;
}
.tab-btn {
    flex: 1;
    padding: 10px;
    text-align: center;
    cursor: pointer;
    color: rgba(255,255,255,0.4);
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1px;
    border: none;
    background: none;
    border-bottom: 2px solid transparent;
    font-family: inherit;
    transition: all 0.2s;
}
.tab-btn.active {
    color: #fff;
    border-bottom-color: #fff;
}
.tab-content { display: none; }
.tab-content.active { display: block; }
.cafe-title {
    color: #fff;
    text-align: center;
    font-size: 28px;
    font-weight: 600;
    margin: 20px auto;
    letter-spacing: 1px;
}
</style>
</head>

<body>

    <!-- two other colors

<body class="lite">
<body class="dark">

-->

    $(if chap-id)
    <form name="sendin" action="$(link-login-only)" method="post" style="display:none">
        <input type="hidden" name="username" />
        <input type="hidden" name="password" />
        <input type="hidden" name="dst" value="$(link-orig)" />
        <input type="hidden" name="popup" value="true" />
    </form>

    <script src="/md5.js"></script>
    <script>
        function doLogin() {
            document.sendin.username.value = document.login.username.value;
            document.sendin.password.value = hexMD5('$(chap-id)' + document.login.password.value + '$(chap-challenge)');
            document.sendin.submit();
            return false;
        }

    </script>
    $(endif)
    <script>
        function switchTab(tab, event) {
            document.querySelectorAll('.tab-content, .tab-btn').forEach(function(el) {
                el.classList.remove('active');
            });
            document.getElementById('tab-' + tab).classList.add('active');
            event.currentTarget.classList.add('active');
        }
    </script>
    <div class="ie-fixMinHeight">
        <div class="main">
            <div class="wrap animated fadeIn">
                <form name="login" action="$(link-login-only)" method="post" $(if chap-id) onSubmit="return doLogin()" $(endif)>
                    <input type="hidden" name="dst" value="$(link-orig)" />

                    <h2 class="cafe-title">Njeremoto Internet Cafe</h2>
                    <p class="info $(if error)alert$(endif)">
                        $(if error == "")Please log in to use the internet hotspot service $(if trial == 'yes')<br />Free trial available, <a href="$(link-login-only)?dst=$(link-orig-esc)&amp;username=T-$(mac-esc)">click here</a>.$(endif)
                        $(endif)

                        $(if error)$(error)$(endif)
                    </p>
                    <div class="tab-bar">
                        <span class="tab-btn active" onclick="switchTab('voucher', event)">Voucher</span>
                        <span class="tab-btn" onclick="switchTab('login', event)">Username / Password</span>
                    </div>
                    <div id="tab-login" class="tab-content">
                    <label>
                        <img class="ico" src="img/user.svg" alt="#" />
                        <input name="username" type="text" value="$(username)" placeholder="Username" />
                    </label>

                    <label>
                        <img class="ico" src="img/password.svg" alt="#" />
                        <input name="password" type="password" placeholder="Password" />
                    </label>
                    </div>

                    <div id="tab-voucher" class="tab-content active">
                    <label>
                        <img class="ico" src="img/password.svg" alt="#" />
                        <input type="text" placeholder="Voucher Code" oninput="document.login.username.value=this.value;document.login.password.value=this.value" />
                    </label>
                    </div>

                    <input type="submit" value="Connect" />

                <p class="info bt">Powered by MikroTik RouterOS</p>
